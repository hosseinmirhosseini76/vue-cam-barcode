name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC trusted publisher
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      # Do NOT set registry-url here — it writes an empty _authToken and
      # blocks the OIDC flow (ENEEDAUTH / E404). See actions/setup-node#1551
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

      # npm 11.5.1+ required for trusted publishing; provenance is automatic
      - run: npm install -g npm@latest
      - run: npm publish --access public
